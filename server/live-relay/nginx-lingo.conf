# lingo.ikonetsolutions.com — relay OmniLingo Live (ivoiro-server). Certificato gestito da certbot (--nginx).
server {
    listen 80;
    listen [::]:80;
    server_name lingo.ikonetsolutions.com;

    location / {
        limit_req zone=lingo_ip burst=20 nodelay;
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
